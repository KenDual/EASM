openapi: 3.0.3
info:
  title: Mini EASM API
  version: 1.0.0
  description: External Attack Surface Management API

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: OK

  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: OK

  /assets:
    get:
      summary: List assets
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated asset list
    post:
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAsset'
      responses:
        '201':
          description: Created asset
        '400':
          $ref: '#/components/responses/Error'

  /assets/{id}:
    get:
      summary: Get asset by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Asset
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete asset
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'

  /assets/{id}/scan:
    post:
      summary: Start a scan (async, 202)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanJob'
      responses:
        '202':
          description: Scan job created

  /scan-jobs/{id}:
    get:
      summary: Get scan job status
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Scan job
        '404':
          $ref: '#/components/responses/Error'

  /scan-jobs/{id}/results:
    get:
      summary: Get scan results for a job
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Array of scan results

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    CreateAsset:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [domain, ip] }

    CreateScanJob:
      type: object
      required: [scan_type]
      properties:
        scan_type:
          type: string
          enum: [dns, whois, subdomain, cert_trans, asn, ip, port, ssl, tech, all]

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
