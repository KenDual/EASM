<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini EASM</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-app text-fg font-sans antialiased">
  <div id="layout" class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="hidden md:flex w-56 shrink-0 flex-col border-r border-line bg-surface">
      <div class="px-4 h-14 flex items-center gap-2 border-b border-line">
        <div class="w-7 h-7 rounded bg-accent/15 text-accent flex items-center justify-center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12l4 4L21 4"/></svg>
        </div>
        <div class="flex flex-col leading-none">
          <span class="text-[13px] font-semibold tracking-tight">Mini EASM</span>
          <span class="text-[10px] text-fg-muted uppercase tracking-widest">attack surface</span>
        </div>
      </div>
      <nav id="nav" class="px-2 py-3 flex flex-col gap-0.5 text-sm flex-1"></nav>
      <div class="px-3 py-3 border-t border-line text-[11px] text-fg-muted">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <span id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-fg-muted"></span>
            <span id="api-status-label">connecting</span>
          </span>
          <span class="font-mono">v1.0</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Topbar -->
      <header class="h-14 border-b border-line bg-surface px-4 md:px-6 flex items-center gap-3 sticky top-0 z-20">
        <button id="mobile-nav-btn" class="md:hidden p-1.5 -ml-1 rounded hover:bg-elevated text-fg-secondary" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div id="breadcrumb" class="text-sm text-fg-secondary flex items-center gap-2"></div>
        <div class="flex-1"></div>
        <div class="relative w-full max-w-sm hidden sm:block">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-fg-muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="global-search" type="search" placeholder="Search assets…"
            class="w-full bg-app border border-line rounded-md pl-8 pr-12 py-1.5 text-sm placeholder:text-fg-muted focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30" />
          <kbd class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-mono text-fg-muted bg-elevated border border-line rounded px-1.5 py-0.5">/</kbd>
        </div>
        <div id="active-jobs-indicator" class="hidden items-center gap-2 text-xs px-2.5 py-1 rounded-md bg-elevated border border-line">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-accent"></span>
          </span>
          <span><span id="active-jobs-count">0</span> active</span>
        </div>
        <button id="new-asset-btn" class="hidden md:inline-flex items-center gap-1.5 text-sm bg-accent text-app font-medium px-3 py-1.5 rounded-md hover:bg-accent-strong transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          New asset
          <kbd class="ml-1 text-[10px] font-mono text-app/70 bg-app/15 rounded px-1 py-0.5">N</kbd>
        </button>
      </header>

      <!-- Page content -->
      <main id="app" class="flex-1 min-w-0 overflow-x-hidden">
        <div id="view-loading" class="flex items-center justify-center py-32 text-fg-muted text-sm">
          <svg class="animate-spin mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          Loading…
        </div>
        <div id="view-overview" class="hidden"></div>
        <div id="view-assets" class="hidden"></div>
        <div id="view-jobs" class="hidden"></div>
      </main>
    </div>
  </div>

  <!-- Drawer -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-black/50 z-40 opacity-0 pointer-events-none transition-opacity"></div>
  <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-2xl bg-surface border-l border-line z-50 translate-x-full transition-transform duration-200 ease-out flex flex-col">
    <div id="drawer-content" class="flex-1 overflow-y-auto"></div>
  </aside>

  <!-- Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-40 opacity-0 pointer-events-none transition-opacity flex items-start justify-center pt-24">
    <div id="modal" class="w-full max-w-md bg-surface border border-line rounded-lg shadow-2xl scale-95 opacity-0 transition-all duration-150"></div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
